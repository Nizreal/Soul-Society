apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hogyoku
  labels:
    app: api-gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      serviceAccountName: gateway-sa
      automountServiceAccountToken: false

      containers:
        - name: api-gateway
          image: hogyoku:dev
          imagePullPolicy: IfNotPresent

          command:
            - /app/target/debug/api_gateway

          env:
            - name: RAFT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: raft-config
                  key: RAFT_ADDR

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3