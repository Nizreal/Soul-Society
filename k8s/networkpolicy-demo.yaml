apiVersion: v1
kind: Namespace
metadata:
  name: np-external
---
apiVersion: v1
kind: Pod
metadata:
  name: external-client
  namespace: np-external
  labels:
    app: external-client
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: client
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: gateway-client
  namespace: hogyoku
  labels:
    app: api-gateway
    networkpolicy-demo: "true"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: client
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
